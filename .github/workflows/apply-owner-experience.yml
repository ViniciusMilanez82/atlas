name: apply-owner-experience-once
on:
  push:
    branches: ["impl/native-owner-experience"]
    paths: [".development/owner-experience/**", ".github/workflows/apply-owner-experience.yml"]
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'ViniciusMilanez82/atlas' && github.ref == 'refs/heads/impl/native-owner-experience'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/native-owner-experience
          fetch-depth: 1
      - name: Decode the exact locally tested patch and verify its identity
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          parts = [Path(f'.development/owner-experience/part-{i}.b64').read_text() for i in range(4)]
          compressed = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '3c1b864f7d335ebfc3d66c992d85e7b82e947e9abc47d387697ca3ff1a03a4cb'
          patch = gzip.decompress(compressed)
          assert len(patch) == 74697
          assert hashlib.sha256(patch).hexdigest() == '514c5dcc45138b559c0c3b1755c08c7707a7422c7650fd224fb38f7e9570dd58'
          Path(os.environ['RUNNER_TEMP'], 'owner.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/owner.patch"
          git apply "$RUNNER_TEMP/owner.patch"
      - name: Publish source and remove this one-use transfer mechanism
        shell: bash
        run: |
          git rm .github/workflows/apply-owner-experience.yml .development/owner-experience/part-*.b64
          git add core runtime platform shared storage tests packaging docs
          git diff --cached --check
          git config user.name "Atlas implementation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(N20/N22): owner setup, scoped privacy and reviewed native voice"
          git push origin HEAD:refs/heads/impl/native-owner-experience
