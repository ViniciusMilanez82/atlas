# CI for the Python core on Linux and macOS (public repo ViniciusMilanez82/atlas).
# The macOS job also builds and tests the Swift package platform/macos/AtlasKit and runs the
# Swift<->Python IPC contract test. It does not prove the interactive app, VM or the owner's Mac.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check.py
  core-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - name: Swift toolchain
        run: swift --version
      - name: Build Swift package (library, app, Keychain service, tools)
        run: swift build --package-path platform/macos/AtlasKit
      - name: Swift tests (framing, IPC, real Keychain, Supervisor with real processes)
        run: |
          ATLAS_PYTHON="$(which python)" ATLAS_REPO="$GITHUB_WORKSPACE"           ATLAS_KEYCHAIN_AGENT="$GITHUB_WORKSPACE/platform/macos/AtlasKit/.build/debug/atlas-keychain-agent"           swift test --package-path platform/macos/AtlasKit
      - name: Python checks including Swift<->Python IPC and daemon E2E
        run: python scripts/check.py
        env:
          ATLAS_SWIFT_PROBE: ${{ github.workspace }}/platform/macos/AtlasKit/.build/debug/atlas-ipc-probe
          ATLAS_KEYCHAIN_AGENT: ${{ github.workspace }}/platform/macos/AtlasKit/.build/debug/atlas-keychain-agent
      - name: Build development Atlas.app (embedded Python, ad-hoc signed, not notarized)
        run: packaging/macos/build_app.sh "$RUNNER_TEMP/dist"
      - name: Verify the bundle starts without system Python
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin             "$(swift build --package-path platform/macos/AtlasKit --show-bin-path)/atlas-bundle-check" "$RUNNER_TEMP/dist/Atlas.app"
      - name: Package artifact
        run: cd "$RUNNER_TEMP/dist" && ditto -c -k --keepParent Atlas.app Atlas-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-dev-app
          path: ${{ runner.temp }}/dist/Atlas-dev.zip
          retention-days: 14
      - name: Open the built app on the runner and capture the real window (evidence only; not interactive validation)
        continue-on-error: true
        run: |
          open "$RUNNER_TEMP/dist/Atlas.app"
          sleep 30
          screencapture -x "$RUNNER_TEMP/atlas-window.png"
          osascript -e 'tell application "Atlas" to quit' || true
          sleep 5
          pgrep -fl "Atlas.app" || echo "app and services stopped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-runner-screenshot
          path: ${{ runner.temp }}/atlas-window.png
          if-no-files-found: warn
          retention-days: 14
