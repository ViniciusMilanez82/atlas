# Never executed yet: the repository has no remote (docs/EXTERNAL_DEPENDENCIES.md D-10).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check.py
  core-macos:
    # Runs the Python core on macOS. Swift, VM and Keychain jobs are added with M1/M2/M4.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check.py
